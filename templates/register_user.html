<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration - Trekora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-body">

<div class="auth-shell">
    <div class="auth-top">
        <a href="{{ url_for('home') }}" class="auth-logo">TREKORA</a>
        <a href="{{ url_for('login') }}" class="auth-home">Login</a>
    </div>

    <div class="auth-center">
        <div class="auth-card">
            <h1 class="auth-title">Join as trekker</h1>
            <p class="auth-subtitle">Create your account to book open treks and track history.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label>Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Contact</label>
                    <input type="text" name="contact" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Register as User
                </button>
            </form>

            <p class="auth-alt mb-0">
                Already registered?
                <a href="{{ url_for('login') }}">Login here</a>
            </p>
        </div>
    </div>
</div>

</body>
</html>
