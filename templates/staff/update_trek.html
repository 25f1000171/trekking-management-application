{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Update Trek</h2>
    <a href="{{ url_for('staff_treks') }}" class="btn btn-secondary">Back</a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <h5>{{ trek.name }}</h5>
        <p class="text-muted">{{ trek.location }} | {{ trek.difficulty }} | {{ trek.duration_days }} days</p>

        <form method="POST">
            <div class="mb-3">
                <label>Total Slots</label>
                <input type="number" class="form-control" value="{{ trek.total_slots }}" disabled>
            </div>

            <div class="mb-3">
                <label>Available Slots</label>
                <input type="number" name="available_slots" class="form-control"
                       value="{{ trek.available_slots }}" min="0" required>
            </div>

            <div class="mb-3">
                <label>Trek Status</label>
                <select name="status" class="form-control" required>
                    <option value="Open" {% if trek.status == "Open" %}selected{% endif %}>Open</option>
                    <option value="Closed" {% if trek.status == "Closed" %}selected{% endif %}>Closed</option>
                    <option value="Ongoing" {% if trek.status == "Ongoing" %}selected{% endif %}>Ongoing</option>
                    <option value="Completed" {% if trek.status == "Completed" %}selected{% endif %}>Completed</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success">Save Changes</button>
        </form>
    </div>
</div>

{% endblock %}
