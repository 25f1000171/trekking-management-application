{% extends "base.html" %}

{% block content %}

<h2>Admin Dashboard</h2>
<p class="text-muted">Welcome, Admin. You can manage the complete trekking system.</p>

<div class="row mt-4">
    <div class="col-md-4">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h5>Total Users</h5>
                <h2 class="text-success">{{ total_users }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card text-center shadow-sm">
            <div class="card-body">
                <h5>Total Trek Staff</h5>
                <h2 class="text-primary">{{ total_staff }}</h2>
            </div>
        </div>
    </div>
</div>

<div class="mt-4">
    <p>Admin management features will be added in the next milestone.</p>
</div>

{% endblock %}
