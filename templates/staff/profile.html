{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Update Staff Profile</h2>
    <a href="{{ url_for('staff_dashboard') }}" class="btn btn-secondary">Back</a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label>Name</label>
                <input type="text" name="name" class="form-control"
                       value="{{ staff.name }}" required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" class="form-control"
                       value="{{ staff.email }}" disabled>
            </div>

            <div class="mb-3">
                <label>Contact</label>
                <input type="text" name="contact" class="form-control"
                       value="{{ staff.contact }}">
            </div>

            <div class="mb-3">
                <label>Experience in Years</label>
                <input type="number" name="experience" class="form-control"
                       value="{{ staff.staff_profile.experience if staff.staff_profile else 0 }}" min="0">
            </div>

            <div class="mb-3">
                <label>Specialization</label>
                <input type="text" name="specialization" class="form-control"
                       value="{{ staff.staff_profile.specialization if staff.staff_profile else '' }}">
            </div>

            <div class="mb-3">
                <label>Address</label>
                <textarea name="address" class="form-control">{{ staff.staff_profile.address if staff.staff_profile else '' }}</textarea>
            </div>

            <button type="submit" class="btn btn-success">Update Profile</button>
        </form>
    </div>
</div>

{% endblock %}
